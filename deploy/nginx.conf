# Static single-page app. Sits behind Traefik (TLS, HTTP -> HTTPS redirect) and
# Cloudflare, so it listens on plain port 80 only and never redirects.
#
# Mounted as /etc/nginx/conf.d/default.conf, which the stock nginx.conf of the
# official image includes inside its http {} block.

# Cache policy by response status and path. Both are read when the response
# headers are written, i.e. after try_files, so every app route answered with
# /index.html gets "no-cache" as well. The first matching line wins.
map "$status:$uri" $cache_control {
    # fingerprinted build output (Vite puts a content hash in every file name)
    "~^(200|206|304):/assets/"      "public, max-age=31536000, immutable";
    # other JSON, e.g. data files
    "~^(200|206|304):.*\.json$"     "public, max-age=300";
    # index.html and every other file: may be stored, must be revalidated before each use
    "~^(200|206|304):"              "no-cache";
    # error responses: never stored
    default                         "no-store";
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # text/html is always compressed
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/manifest+json application/xml image/svg+xml;

    # All add_header lines live here, at server level, and no location adds its
    # own: a location with an add_header would drop every header set here.
    # "always" also covers error responses. For Cache-Control that matters:
    # unless a 404 says "no-store", Cloudflare stamps "max-age=14400" on it for
    # .js, .css and similar URLs, and browsers keep the error for four hours.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Build output: a missing file is a real 404. Never answer with the app
    # shell here, it would be cached as if it were the script or stylesheet.
    location /assets/ {
        try_files $uri =404;
    }

    # Everything else: the file if it exists, otherwise the app shell, so that
    # deep links into client-side routes work.
    location / {
        try_files $uri /index.html;
    }
}
